# osquery agents -> osctrl-tls (only reachable inside the compose network)
server {
    listen 443 ssl;
    server_tokens off;
    ssl_certificate /tls/osctrl.crt;
    ssl_certificate_key /tls/osctrl.key;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://osctrl-tls:9000;
        proxy_read_timeout 90;
    }
}

# Web UI + API (frontend proxies /api to osctrl-api) -> https://localhost:8444
server {
    listen 8444 ssl;
    server_tokens off;
    ssl_certificate /tls/osctrl.crt;
    ssl_certificate_key /tls/osctrl.key;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://osctrl-frontend:80;
        proxy_read_timeout 120;
    }
}
